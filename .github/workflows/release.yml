name: Release

# Push a tag like v1.2.0 to build and publish a GitHub Release.
# The tag must match <Version> in SteamCmdHelper.csproj and have a "## 1.2.0" section in CHANGELOG.md.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check version and read release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          csproj=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' SteamCmdHelper.csproj)
          if [ "$version" != "$csproj" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match <Version>$csproj</Version> in SteamCmdHelper.csproj"
            exit 1
          fi
          awk -v v="$version" '
            { sub(/\r$/, "") }
            $0 == "## " v { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## $version' section"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test tests/SteamCmdHelper.Tests -c Release

      - name: Publish
        env:
          # Baked into the exe so the ? button can send layout requests (see RequestKey.targets).
          LINEAR_CREATE_API_KEY: ${{ secrets.LINEAR_CREATE_API_KEY }}
          LINEAR_TEAM_UUID: ${{ secrets.LINEAR_TEAM_UUID }}
        run: |
          # Self-contained single exe: runs without .NET installed.
          dotnet publish SteamCmdHelper.csproj -c Release -r win-x64 --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out/standalone
          # Framework-dependent folder: small, for machines with the .NET 8 Desktop Runtime
          # or where antivirus refuses large unsigned single-file exes.
          dotnet publish SteamCmdHelper.csproj -c Release -r win-x64 --no-self-contained -o out/portable

          mkdir dist
          cp out/standalone/SteamCmdHelper.exe "dist/SteamCmdHelper-$VERSION-win-x64.exe"
          (cd out/portable && 7z a -tzip "../../dist/SteamCmdHelper-$VERSION-win-x64-framework-dependent.zip" . > /dev/null)
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -l dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "SteamCMD Helper $VERSION" --notes-file notes.md $prerelease
