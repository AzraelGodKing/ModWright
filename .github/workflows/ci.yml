name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # The upload tests drive a fake SteamCMD shell script and only run off Windows.
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/SteamCmdHelper.Tests -c Release

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build app
        run: dotnet build SteamCmdHelper.csproj -c Release

      - name: Test
        run: dotnet test tests/SteamCmdHelper.Tests -c Release --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      - name: Publish self-contained exe
        env:
          # Baked into the exe so the ? button can send layout requests (see RequestKey.targets).
          # Empty for pull requests from forks, which then build without a key.
          LINEAR_CREATE_API_KEY: ${{ secrets.LINEAR_CREATE_API_KEY }}
          LINEAR_TEAM_UUID: ${{ secrets.LINEAR_TEAM_UUID }}
          PROJECTID: ${{ secrets.PROJECTID }}
          LABELIDS: ${{ secrets.LABELIDS }}
          LABELMAP: ${{ secrets.LABELMAP }}
        run: dotnet publish SteamCmdHelper.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: SteamCmdHelper-win-x64
          path: publish/SteamCmdHelper.exe

      # Screenshots of both themes for reviewing UI changes. Best effort: never fails the build.
      - name: Screenshots
        continue-on-error: true
        timeout-minutes: 3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          Start-Process -FilePath publish/SteamCmdHelper.exe -ArgumentList '--shot', "$PWD\shots" -Wait
          Get-ChildItem shots
          if (Test-Path shots/error.txt) { Get-Content shots/error.txt }
          foreach ($f in Get-ChildItem shots -Filter *.png) { Write-Output "=====BEGIN $($f.Name)"; $b=[Convert]::ToBase64String([IO.File]::ReadAllBytes($f.FullName)); for($i=0;$i -lt $b.Length;$i+=4000){ Write-Output ("B64:" + $b.Substring($i,[Math]::Min(4000,$b.Length-$i))) }; Write-Output "=====END $($f.Name)" }

      - name: Upload screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
          if-no-files-found: ignore
