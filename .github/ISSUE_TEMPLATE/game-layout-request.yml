name: Game layout request
description: Ask for built-in support for another Steam game's Workshop mods
title: "Game layout request: "
labels: ["game-request"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Requests filled in from the "?" button in SteamCMD Helper arrive pre-filled. Please check nothing private is in the boxes before you submit.
  - type: input
    id: game
    attributes:
      label: Game
      description: The game's name on Steam.
    validations:
      required: true
  - type: input
    id: appid
    attributes:
      label: Steam app ID
      description: The number in the game's store URL (store.steampowered.com/app/NUMBER/).
    validations:
      required: true
  - type: input
    id: helper
    attributes:
      label: Helper version and layout in use
  - type: textarea
    id: layout
    attributes:
      label: What does one mod look like?
      description: File names in one mod folder, where the title, version and changelog live, and how mods are published in the game (in-game uploader, a tool, or the Workshop page). File names only, no need to paste file contents.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Links to the game's Workshop documentation, or a sample mod you know works. Optional.